name: Build Zero Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE: /

      - name: Prepare native Android project
        run: |
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/gradlew" ]; then
            echo "Generating fresh Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Syncing web assets to Android platform..."
            npx cap sync android
          fi
          # Generate native Android icons and splash assets from /assets
          npx @capacitor/assets generate --android || true
          # Ensure compileSdk is 36
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          # Prevent checkAarMetadata issues
          if ! grep -q "CheckAarMetadata" android/app/build.gradle 2>/dev/null; then
            echo 'tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.all { enabled = false }' >> android/app/build.gradle
          fi
          chmod +x android/gradlew

      - name: Compile Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
