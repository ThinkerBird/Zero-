name: Build Zero Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE: /

      - name: Prepare native Android project
        run: |
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/gradlew" ]; then
            echo "Generating fresh Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Syncing web assets to Android platform..."
            npx cap sync android
          fi
          # Generate native Android icons and splash assets from /assets
          npx @capacitor/assets generate --android || true
          # Sync version name from package.json
          APP_VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/versionName \".*\"/versionName \"$APP_VERSION\"/g" android/app/build.gradle 2>/dev/null || true
          # Ensure compileSdk is 36
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          # Prevent checkAarMetadata issues
          if ! grep -q "CheckAarMetadata" android/app/build.gradle 2>/dev/null; then
            echo 'tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.all { enabled = false }' >> android/app/build.gradle
          fi
          chmod +x android/gradlew

      - name: Compile Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Named Release APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Zero-v${{ steps.get_version.outputs.version }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Zero-Android.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Android-APK
          path: android/app/build/outputs/apk/debug/Zero-v${{ steps.get_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Zero v${{ steps.get_version.outputs.version }}
          files: |
            android/app/build/outputs/apk/debug/Zero-v${{ steps.get_version.outputs.version }}.apk
            android/app/build/outputs/apk/debug/Zero-Android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
